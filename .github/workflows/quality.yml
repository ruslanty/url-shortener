name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Quality and integration checks
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Engine
        uses: docker/setup-docker-action@7ec28a010822b4626af4874f9448a4b05ac6f3e5 # v5.6.0
        with:
          version: v29.9.2

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2.4.0
        with:
          version: v5.6.1

      - name: Configure bind-mount user
        run: |
          echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Validate Compose configuration
        run: docker compose --profile tools config --quiet

      - name: Run all quality and integration checks
        run: docker compose run --build --rm quality

      - name: Stop services
        if: always()
        run: docker compose down --volumes --remove-orphans
